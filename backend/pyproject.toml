[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syncthing-control-center"
version = "0.1.0.dev0"
description = "Syncthing Control Center backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.1",
  "SQLAlchemy==2.0.55",
  "psycopg==3.3.6",
  "psycopg-binary==3.3.6",
  "alembic==1.20.1",
  "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.2",
  "httpx2==2.16.0",
  "jsonschema==4.23.0",
  "openapi-spec-validator==0.7.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["../tests/unit", "../tests/contract"]
addopts = "--import-mode=importlib --strict-markers -ra"
