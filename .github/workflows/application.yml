name: Application core

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/application.yml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install -r backend/requirements-dev.txt -e './backend[dev]'
      - name: Check application and real test services
        run: python scripts/check_application.py run --work-dir "$RUNNER_TEMP/scc-application-private" --report-dir "$RUNNER_TEMP/scc-application-reports"
      - name: Cleanup owned resources after success, failure or cancellation
        if: always()
        run: python scripts/check_application.py cleanup --work-dir "$RUNNER_TEMP/scc-application-private" --report-dir "$RUNNER_TEMP/scc-application-reports"
      - name: Upload public reports only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-core-reports
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/scc-application-reports/summary.json
            ${{ runner.temp }}/scc-application-reports/cleanup.json
            ${{ runner.temp }}/scc-application-reports/offline.xml
            ${{ runner.temp }}/scc-application-reports/postgres.xml
            ${{ runner.temp }}/scc-application-reports/core.json
